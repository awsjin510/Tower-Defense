<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tower Defense — 放置塔防</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; background: #0a0e14; color: #e6edf3; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; }
      #app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }

      #authbar {
        display: flex; align-items: center; justify-content: flex-end; gap: 8px;
        min-height: 34px; padding: 4px 12px; background: #0d1117; color: #8b949e;
        border-bottom: 1px solid #21262d; font-size: 11px;
      }
      #auth-btn, #account-btn {
        padding: 4px 9px; border: 1px solid #30363d; border-radius: 6px;
        background: #21262d; color: #e6edf3; font-size: 11px; cursor: pointer;
      }
      #auth-btn:disabled { opacity: 0.5; }
      #account-btn { border-color: #2b6cb0; }

      #topbar {
        display: flex; align-items: center; gap: 12px;
        padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
        background: #12171f; border-bottom: 1px solid #21262d; font-size: 14px;
      }
      #topbar .stat { display: flex; flex-direction: column; }
      #topbar .stat .label { font-size: 10px; color: #8b949e; }
      #topbar .stat .value { font-weight: 700; font-variant-numeric: tabular-nums; }
      #topbar .spacer { flex: 1; }
      .coin { color: #e3b341; }
      .cash { color: #56d364; }

      #canvas-wrap { position: relative; width: 100%; flex: 1 1 auto; min-height: 0; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      .speed-btn {
        background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px;
        padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
        min-width: 44px; min-height: 32px;
      }

      /* 波次橫幅：從頂端滑入 */
      #wave-banner {
        position: absolute; top: 14px; left: 50%; transform: translate(-50%, -80px);
        padding: 8px 22px; border-radius: 999px; font-size: 17px; font-weight: 800;
        letter-spacing: 1px; background: rgba(31, 111, 235, 0.92); color: #fff;
        box-shadow: 0 4px 20px rgba(31, 111, 235, 0.5); opacity: 0; pointer-events: none;
        white-space: nowrap; z-index: 5;
      }
      #wave-banner.show { animation: bannerIn 0.4s ease-out forwards; }
      #wave-banner.boss {
        background: rgba(214, 60, 60, 0.94); box-shadow: 0 4px 24px rgba(214, 60, 60, 0.6);
        font-size: 18px;
      }
      @keyframes bannerIn {
        0% { transform: translate(-50%, -80px); opacity: 0; }
        18% { transform: translate(-50%, 0); opacity: 1; }
        82% { transform: translate(-50%, 0); opacity: 1; }
        100% { transform: translate(-50%, -80px); opacity: 0; }
      }

      #bottom { flex: 0 0 auto; background: #161b22; border-top: 1px solid #21262d; }
      #tabs { display: flex; }
      #tabs button {
        flex: 1; padding: 9px 0; background: none; border: none; border-bottom: 2px solid transparent;
        color: #8b949e; font-size: 14px; font-weight: 700; cursor: pointer;
      }
      #tabs button.active { color: #e6edf3; border-bottom-color: #58a6ff; }
      #tabs button[data-tab="attack"].active { border-bottom-color: #f85149; }
      #tabs button[data-tab="defense"].active { border-bottom-color: #58a6ff; }
      #tabs button[data-tab="economy"].active { border-bottom-color: #e3b341; }

      .upgrade-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px;
        max-height: 32vh; overflow-y: auto;
      }
      .upgrade-btn {
        display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
        background: #21262d; border: 1px solid #30363d; border-radius: 8px;
        padding: 8px 10px; color: #e6edf3; cursor: pointer; text-align: left; font-size: 13px;
        min-height: 44px; transition: border-color 0.15s, box-shadow 0.15s, transform 0.06s;
      }
      .upgrade-btn:not(:disabled):active { background: #30363d; transform: scale(0.97); }
      .upgrade-btn:disabled { opacity: 0.42; cursor: default; }
      /* 買得起：發亮 + 呼吸脈動 */
      .upgrade-btn.affordable { border-color: #2ea043; box-shadow: 0 0 0 1px #2ea043; animation: afford 1.6s ease-in-out infinite; }
      @keyframes afford {
        0%, 100% { box-shadow: 0 0 0 1px rgba(46, 160, 67, 0.5), 0 0 6px rgba(46, 160, 67, 0.15); }
        50% { box-shadow: 0 0 0 1px rgba(46, 160, 67, 0.9), 0 0 12px rgba(46, 160, 67, 0.45); }
      }
      @media (prefers-reduced-motion: reduce) { .upgrade-btn.affordable { animation: none; } #wave-banner.show { animation-duration: 0.01s; } }
      .upgrade-btn .name { font-weight: 700; font-size: 13px; color: #c9d1d9; }
      .upgrade-btn .value { font-size: 19px; font-weight: 800; color: #58a6ff; font-variant-numeric: tabular-nums; line-height: 1.15; margin: 1px 0; }
      .upgrade-btn .foot { display: flex; justify-content: space-between; align-items: baseline; width: 100%; gap: 6px; margin-top: auto; }
      .upgrade-btn .delta { font-size: 10px; color: #8b949e; font-variant-numeric: tabular-nums; }
      .upgrade-btn .cost { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }

      .screen { display: none; }
      .screen.active { display: block; }
      #workshop-screen, #cards-screen, #research-screen, #ultimates-screen { flex: 1; overflow-y: auto; padding: 14px; }
      #workshop-screen h1, #cards-screen h1, #research-screen h1, #ultimates-screen h1 { font-size: 20px; margin-bottom: 2px; }
      #workshop-screen .sub, #cards-screen .sub, #research-screen .sub, #ultimates-screen .sub { color: #8b949e; font-size: 13px; margin-bottom: 12px; }
      #workshop-screen h2 { font-size: 14px; color: #8b949e; margin: 14px 0 6px; }
      #workshop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

      /* 工坊 / 卡片 分頁切換 */
      .meta-nav { display: flex; gap: 8px; margin-bottom: 12px; }
      .meta-nav button {
        flex: 1; padding: 9px 0; background: #161b22; color: #8b949e;
        border: 1px solid #30363d; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
      }
      .meta-nav button.active { color: #e6edf3; border-color: #58a6ff; background: #1b2331; }

      /* 卡片畫面 */
      #card-loadout-label { font-size: 13px; color: #8b949e; margin-bottom: 8px; }
      #card-loadout-label b { color: #e6edf3; }
      #card-loadout-label b.flash { color: #f85149; }
      #card-loadout { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
      .loadout-slot {
        flex: 1 1 calc(50% - 4px); min-height: 52px; display: flex; align-items: center; gap: 8px;
        padding: 8px 10px; border: 1px dashed #30363d; border-radius: 10px; background: #0d1117; cursor: pointer;
      }
      .loadout-slot.filled { border-style: solid; background: #161b22; }
      .loadout-slot .slot-icon { font-size: 20px; }
      .loadout-slot .slot-name { font-size: 13px; font-weight: 700; }
      .loadout-slot .slot-empty { color: #6e7681; font-size: 22px; width: 100%; text-align: center; }
      .slot-unlock {
        flex: 1 1 calc(50% - 4px); min-height: 52px; padding: 6px; background: #0d1117; color: #e3b341;
        border: 1px solid #4d3b12; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; line-height: 1.4;
      }
      .slot-unlock:disabled { opacity: 0.45; cursor: default; }

      #card-inventory { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .card-cell {
        background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 10px;
        display: flex; flex-direction: column; gap: 6px;
      }
      .card-cell.equipped { border-color: #58a6ff; box-shadow: 0 0 0 1px #58a6ff, 0 0 12px rgba(88,166,255,0.25); }
      .card-cell.locked { opacity: 0.6; }
      .card-art {
        position: relative; height: 76px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
        border: 1px solid #ffffff14;
      }
      .card-art.locked-art { background: #0d1117; font-size: 30px; }
      .card-icon { font-size: 34px; }
      .card-stars { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 12px; color: #e3b341; letter-spacing: 1px; }
      .card-name { font-size: 14px; font-weight: 800; }
      .card-sub { font-size: 11px; color: #8b949e; min-height: 26px; }
      .card-actions { display: flex; gap: 6px; }
      .card-actions button {
        flex: 1; padding: 7px 4px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer;
        border: 1px solid #30363d; background: #21262d; color: #e6edf3;
      }
      .card-cell.equipped .card-equip { background: #1f6feb; border-color: #1f6feb; color: #fff; }
      .card-actions .card-star { color: #e3b341; }
      .card-actions button:disabled { opacity: 0.4; cursor: default; }
      #cards-screen h1 { font-size: 20px; }

      /* 研究室 */
      #research-list { display: flex; flex-direction: column; gap: 10px; }
      .research-row {
        display: flex; align-items: center; gap: 12px; padding: 12px;
        background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      }
      .research-row.active { border-color: #58a6ff; box-shadow: 0 0 0 1px #58a6ff, 0 0 12px rgba(88,166,255,0.2); }
      .research-row.busy-other { opacity: 0.55; }
      .research-icon {
        width: 46px; height: 46px; flex: 0 0 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
        font-size: 26px; border: 1px solid #ffffff14;
      }
      .research-body { flex: 1; min-width: 0; }
      .research-name { font-size: 15px; font-weight: 800; }
      .research-name .lv { color: #8b949e; font-size: 12px; font-weight: 700; margin-left: 6px; }
      .research-sub { font-size: 12px; color: #8b949e; font-variant-numeric: tabular-nums; }
      .research-bar { height: 6px; border-radius: 3px; background: #0d1117; margin-top: 6px; overflow: hidden; }
      .research-bar > span { display: block; height: 100%; background: #58a6ff; transition: width 0.4s linear; }
      .research-cta { flex: 0 0 auto; }
      .research-cta button {
        padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
        border: 1px solid #30363d; background: #21262d; color: #e6edf3; min-width: 76px;
      }
      .research-cta button.start { border-color: #2ea043; color: #56d364; }
      .research-cta button:disabled { opacity: 0.4; cursor: default; }
      .research-timer { font-size: 13px; font-weight: 800; color: #58a6ff; font-variant-numeric: tabular-nums; }
      .meta-nav button { font-size: 13px; padding: 9px 2px; }

      /* 終極武器：升級畫面 */
      #ultimates-list { display: flex; flex-direction: column; gap: 10px; }
      .ult-row {
        display: flex; align-items: center; gap: 12px; padding: 12px;
        background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      }
      .ult-row.locked { opacity: 0.6; }
      .ult-icon {
        width: 50px; height: 50px; flex: 0 0 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
        font-size: 28px; border: 1px solid #ffffff1a;
      }
      .ult-body { flex: 1; min-width: 0; }
      .ult-name { font-size: 15px; font-weight: 800; }
      .ult-name .lv { color: #8b949e; font-size: 12px; font-weight: 700; margin-left: 6px; }
      .ult-sub { font-size: 12px; color: #8b949e; }
      .ult-cta button {
        padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
        border: 1px solid #30363d; background: #21262d; color: #e3b341; min-width: 82px; line-height: 1.4;
      }
      .ult-cta button:disabled { opacity: 0.4; cursor: default; color: #8b949e; }

      /* 終極武器：戰鬥中施放鈕（浮在畫布左下） */
      #ult-bar {
        position: absolute; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
        display: flex; flex-direction: column; gap: 10px; z-index: 6;
      }
      .ult-btn {
        position: relative; width: 58px; height: 58px; border-radius: 50%;
        border: 2px solid var(--ult-color, #e3b341); background: #0d1117cc; color: #fff;
        font-size: 26px; cursor: pointer; overflow: hidden; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
        box-shadow: 0 0 12px var(--ult-color, #e3b341);
      }
      .ult-btn:active { transform: scale(0.94); }
      .ult-btn.cooling { box-shadow: none; }
      /* 冷卻遮罩：從底部升起的暗層 + 秒數 */
      .ult-btn .cool-mask {
        position: absolute; left: 0; right: 0; bottom: 0; background: rgba(1,4,9,0.72);
        pointer-events: none;
      }
      .ult-btn .cool-num {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 16px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; pointer-events: none;
      }
      #battle-screen { flex: 1; display: none; flex-direction: column; min-height: 0; }
      #battle-screen.active { display: flex; }

      #start-btn {
        display: block; width: 100%; margin-top: 16px; padding: 14px;
        background: #238636; color: #fff; border: none; border-radius: 8px;
        font-size: 17px; font-weight: 700; cursor: pointer;
      }
      #start-btn:active { background: #2ea043; }

      #results {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(1, 4, 9, 0.8); z-index: 10;
      }
      #results.active { display: flex; }
      #results .card {
        background: #161b22; border: 1px solid #30363d; border-radius: 12px;
        padding: 24px 32px; text-align: center; min-width: 260px;
      }
      #results .card { animation: cardPop 0.3s ease-out; }
      @keyframes cardPop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
      #results h2 { margin-bottom: 14px; font-size: 18px; }
      #results .record {
        margin: -4px 0 12px; padding: 6px; font-size: 15px; font-weight: 800; color: #e3b341;
        background: rgba(227, 179, 65, 0.12); border-radius: 8px; letter-spacing: 1px;
      }
      #results .row { display: flex; justify-content: space-between; gap: 24px; margin: 6px 0; font-size: 14px; }
      #results .row .label { color: #8b949e; }
      #results .row .value { font-weight: 700; font-variant-numeric: tabular-nums; }
      #results button {
        margin-top: 16px; width: 100%; padding: 12px; background: #1f6feb; color: #fff;
        border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer;
      }

      /* Perk 三選一：戰鬥暫停時的覆蓋層 */
      #perk-overlay {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(1, 4, 9, 0.82); z-index: 12; padding: 16px;
      }
      #perk-overlay.active { display: flex; }
      #perk-overlay .perk-box {
        background: #161b22; border: 1px solid #30363d; border-radius: 12px;
        padding: 20px; width: 100%; max-width: 400px; animation: cardPop 0.3s ease-out;
      }
      #perk-overlay h2 { font-size: 18px; text-align: center; }
      #perk-overlay .sub { color: #8b949e; font-size: 12px; text-align: center; margin: 4px 0 14px; }
      .perk-card {
        display: flex; flex-direction: column; gap: 3px; width: 100%; margin: 8px 0;
        background: #21262d; border: 1px solid #3b82f6; border-radius: 10px;
        padding: 12px 14px; color: #e6edf3; cursor: pointer; text-align: left;
        min-height: 44px; transition: transform 0.06s, box-shadow 0.15s;
        box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.25);
      }
      .perk-card:active { transform: scale(0.97); }
      .perk-card .perk-name { font-size: 15px; font-weight: 800; }
      .perk-card .perk-desc { font-size: 12px; color: #8b949e; }
      .perk-card.risky { border-color: #f85149; box-shadow: 0 0 0 1px rgba(248, 81, 73, 0.3); }
      .perk-card.risky .perk-name::after { content: " ⚠ 高風險"; font-size: 11px; color: #f85149; }

      /* 離線收益結算 */
      #offline-modal {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(1, 4, 9, 0.8); z-index: 11;
      }
      #offline-modal.active { display: flex; }
      #offline-modal .card {
        background: #161b22; border: 1px solid #30363d; border-radius: 12px;
        padding: 24px 32px; text-align: center; min-width: 260px; animation: cardPop 0.3s ease-out;
      }
      #offline-modal h2 { margin-bottom: 14px; font-size: 18px; }
      #offline-modal .row { display: flex; justify-content: space-between; gap: 24px; margin: 6px 0; font-size: 14px; }
      #offline-modal .row .label { color: #8b949e; }
      #offline-modal .row .value { font-weight: 700; font-variant-numeric: tabular-nums; }
      #offline-modal button {
        margin-top: 16px; width: 100%; padding: 12px; background: #238636; color: #fff;
        border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer;
      }

      /* 帳戶面板（霓虹風，參考 The Tower） */
      #account-modal {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(1, 4, 9, 0.82); z-index: 13; padding: 16px;
      }
      #account-modal.active { display: flex; }
      #account-modal .account-card {
        background: #0d1524; border: 1px solid #2b6cb0; border-radius: 14px;
        box-shadow: 0 0 22px rgba(56, 189, 248, 0.25), inset 0 0 20px rgba(56, 189, 248, 0.05);
        padding: 22px; width: 100%; max-width: 380px; animation: cardPop 0.3s ease-out;
      }
      #account-modal h2 { text-align: center; font-size: 20px; letter-spacing: 3px; color: #cde8ff; margin-bottom: 14px; }
      .account-id {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        font-size: 14px; font-weight: 800; color: #e6edf3; letter-spacing: 1px; margin-bottom: 4px;
      }
      .account-id #account-id-val { font-variant-numeric: tabular-nums; word-break: break-all; }
      #account-copy {
        background: none; border: 1px solid #2b6cb0; border-radius: 6px; color: #9ecbff;
        font-size: 13px; padding: 2px 6px; cursor: pointer; min-width: 30px; min-height: 30px;
      }
      #account-copy.copied { border-color: #2ea043; color: #56d364; }
      .account-linked-label { text-align: center; color: #8b949e; font-size: 13px; margin: 14px 0 8px; }
      .linked-row {
        display: flex; align-items: center; gap: 10px;
        background: #0a1120; border: 1px solid #2b6cb0; border-radius: 10px;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.18);
        padding: 12px 14px; margin-bottom: 8px; font-size: 15px; font-weight: 700;
      }
      .linked-row .mail { flex: 1; word-break: break-all; }
      .linked-row .check { color: #3fb950; font-size: 18px; font-weight: 900; }
      .linked-none {
        text-align: center; color: #6e7681; font-size: 13px; padding: 12px;
        border: 1px dashed #30363d; border-radius: 10px; margin-bottom: 8px;
      }
      .account-action {
        display: block; width: 100%; margin-top: 8px; padding: 12px;
        background: #0a1120; color: #cde8ff; border: 1px solid #2b6cb0; border-radius: 10px;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.12);
        font-size: 15px; font-weight: 700; cursor: pointer;
      }
      .account-action:active { background: #142238; }
      .account-action.danger { border-color: #6e2b2b; color: #ffb4b4; box-shadow: none; }
      .account-note {
        color: #8b949e; font-size: 12px; line-height: 1.6; text-align: center;
        padding: 6px 2px; margin-top: 6px;
      }
      #account-close {
        display: block; width: 100%; margin-top: 16px; padding: 10px;
        background: #161b22; color: #8b949e; border: 1px solid #30363d; border-radius: 8px;
        font-size: 14px; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="authbar"><span id="auth-status">本機存檔</span><button id="account-btn" type="button">👤 帳戶</button><button id="auth-btn" type="button">Google 登入</button></div>
      <header id="topbar"></header>

      <div id="workshop-screen" class="screen active">
        <div class="meta-nav">
          <button data-meta="workshop" class="active" type="button">🛠️ 工坊</button>
          <button data-meta="cards" type="button">🃏 卡片</button>
          <button data-meta="research" type="button">🔬 研究</button>
          <button data-meta="ultimates" type="button">💥 終極</button>
        </div>
        <h1>🛠️ 工坊</h1>
        <div class="sub">用金幣購買永久升級，每一場都會更強</div>
        <div id="workshop-grid"></div>
        <button id="start-btn">⚔️ 開始戰鬥</button>
      </div>

      <div id="cards-screen" class="screen">
        <div class="meta-nav">
          <button data-meta="workshop" type="button">🛠️ 工坊</button>
          <button data-meta="cards" class="active" type="button">🃏 卡片</button>
          <button data-meta="research" type="button">🔬 研究</button>
          <button data-meta="ultimates" type="button">💥 終極</button>
        </div>
        <h1>🃏 卡片</h1>
        <div class="sub">戰前配置卡片，槽位有限——取捨出你的流派</div>
        <div id="card-loadout-label"></div>
        <div id="card-loadout"></div>
        <div id="card-inventory"></div>
      </div>

      <div id="research-screen" class="screen">
        <div class="meta-nav">
          <button data-meta="workshop" type="button">🛠️ 工坊</button>
          <button data-meta="cards" type="button">🃏 卡片</button>
          <button data-meta="research" class="active" type="button">🔬 研究</button>
          <button data-meta="ultimates" type="button">💥 終極</button>
        </div>
        <h1>🔬 研究室</h1>
        <div class="sub">用真實時間跑研究，離線也在推進——一次只能跑一項</div>
        <div id="research-list"></div>
      </div>

      <div id="ultimates-screen" class="screen">
        <div class="meta-nav">
          <button data-meta="workshop" type="button">🛠️ 工坊</button>
          <button data-meta="cards" type="button">🃏 卡片</button>
          <button data-meta="research" type="button">🔬 研究</button>
          <button data-meta="ultimates" class="active" type="button">💥 終極</button>
        </div>
        <h1>💥 終極武器</h1>
        <div class="sub">戰鬥中施放的大招——達里程碑解鎖，用金幣升級威力與冷卻</div>
        <div id="ultimates-list"></div>
      </div>

      <div id="battle-screen" class="screen">
        <div id="canvas-wrap">
          <canvas id="game"></canvas>
          <div id="wave-banner"></div>
          <div id="ult-bar"></div>
        </div>
        <div id="bottom">
          <div id="tabs"></div>
          <div id="battle-grid" class="upgrade-grid"></div>
        </div>
      </div>

      <div id="results">
        <div class="card">
          <h2>⚔️ 戰鬥結束</h2>
          <div id="results-rows"></div>
          <button id="results-btn">回到工坊</button>
        </div>
      </div>

      <div id="perk-overlay">
        <div class="perk-box">
          <h2>⭐ 選擇一項強化</h2>
          <div class="sub" id="perk-sub"></div>
          <div id="perk-cards"></div>
        </div>
      </div>

      <div id="offline-modal">
        <div class="card">
          <h2>🌙 離線收益</h2>
          <div id="offline-rows"></div>
          <button id="offline-btn">收下</button>
        </div>
      </div>

      <div id="account-modal">
        <div class="account-card">
          <h2>帳戶</h2>
          <div class="account-id">ID: <span id="account-id-val">—</span><button id="account-copy" type="button" title="複製 ID">📋</button></div>
          <div class="account-linked-label">已連結帳號</div>
          <div id="account-linked"></div>
          <div id="account-actions"></div>
          <button id="account-close" type="button">關閉</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
