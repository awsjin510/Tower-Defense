      :root {
        --font-num: 'Orbitron', system-ui, sans-serif;
        --bg: #070b12;
        --panel: linear-gradient(158deg, rgba(30,41,60,0.78), rgba(15,21,33,0.72));
        --panel-solid: #121a28;
        --brd: rgba(126,160,215,0.20);
        --brd-strong: rgba(120,170,255,0.45);
        --muted: #8a97ab;
        --text: #e8eef7;
        --accent: #4aa3ff;
        --glass-hi: inset 0 1px 0 rgba(255,255,255,0.07);
        --glass-sh: 0 6px 20px rgba(0,0,0,0.38);
      }

      html, body { height: 100%; color: var(--text); font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
        background:
          radial-gradient(1100px 750px at 18% -12%, rgba(58,96,190,0.20), transparent 60%),
          radial-gradient(950px 700px at 92% 8%, rgba(150,74,205,0.15), transparent 55%),
          radial-gradient(900px 900px at 50% 118%, rgba(40,130,150,0.13), transparent 60%),
          var(--bg); background-attachment: fixed; }
      #app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }

      #authbar {
        display: flex; align-items: center; justify-content: flex-end; gap: 8px;
        min-height: 34px; padding: 4px 12px; background: #0d1117; color: #8b949e;
        border-bottom: 1px solid #21262d; font-size: 11px;
      }
      #auth-btn, #account-btn, #sound-btn {
        padding: 4px 9px; border: 1px solid #30363d; border-radius: 6px;
        background: #21262d; color: #e6edf3; font-size: 11px; cursor: pointer;
      }
      #auth-btn:disabled { opacity: 0.5; }
      #account-btn { border-color: #2b6cb0; }
      #sound-btn, #board-btn, #daily-btn { padding: 4px 7px; font-size: 13px; line-height: 1; }
      #sound-btn.muted { opacity: 0.5; }
      #board-btn { border-color: #b8860b; }
      #daily-btn { border-color: #2ea043; position: relative; }
      #daily-btn.has-claim::after {
        content: ''; position: absolute; top: -3px; right: -3px; width: 9px; height: 9px;
        background: #f85149; border-radius: 50%; box-shadow: 0 0 6px #f85149;
      }

      #topbar {
        display: flex; align-items: center; gap: 12px;

      #topbar .stat .label { font-size: 10px; color: #8b949e; }
      #topbar .stat .value { font-weight: 700; font-variant-numeric: tabular-nums; }
      #topbar .spacer { flex: 1; }
      .coin { color: #e3b341; }
      .cash { color: #56d364; }

      #canvas-wrap {
        position: relative; width: 100%; flex: 1 1 auto; min-height: 0;
        overflow: hidden; contain: layout paint; background: #05070d;
      }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

      .speed-btn {
        background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px;
        padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer;

      /* 波次橫幅：從頂端滑入 */
      #wave-banner {
        position: absolute; top: 14px; left: 50%; transform: translate(-50%, -80px);
        padding: 8px 22px; border-radius: 999px; font-size: 17px; font-weight: 800;
        letter-spacing: 1px; background: rgba(31, 111, 235, 0.92); color: #fff;

        font-size: 18px;
      }
      @keyframes bannerIn {
        0% { transform: translate(-50%, -80px); opacity: 0; }
        18% { transform: translate(-50%, 0); opacity: 1; }
        82% { transform: translate(-50%, 0); opacity: 1; }
        100% { transform: translate(-50%, -80px); opacity: 0; }

      #bottom { flex: 0 0 auto; background: #161b22; border-top: 1px solid #21262d; }

      .upgrade-grid {

      .upgrade-btn {

        transition: border-color 0.15s, box-shadow 0.15s, transform 0.06s;
      }
      .upgrade-btn:not(:disabled):active { background: #30363d; transform: scale(0.97); }
      .upgrade-btn:disabled { opacity: 0.42; cursor: default; }
      /* 買得起：發亮 + 呼吸脈動 */
      .upgrade-btn.affordable { border-color: #2ea043; box-shadow: 0 0 0 1px #2ea043; animation: afford 1.6s ease-in-out infinite; }
      @keyframes afford {
        0%, 100% { box-shadow: 0 0 0 1px rgba(46, 160, 67, 0.5), 0 0 6px rgba(46, 160, 67, 0.15); }
        50% { box-shadow: 0 0 0 1px rgba(46, 160, 67, 0.9), 0 0 12px rgba(46, 160, 67, 0.45); }
      }
      @media (prefers-reduced-motion: reduce) { .upgrade-btn.affordable { animation: none; } #wave-banner.show { animation-duration: 0.01s; } }
      .upgrade-btn .name { font-weight: 700; font-size: 13px; color: #c9d1d9; }
      .upgrade-btn .value { font-size: 19px; font-weight: 800; color: #58a6ff; font-variant-numeric: tabular-nums; line-height: 1.15; margin: 1px 0; }
      .upgrade-btn .foot { display: flex; justify-content: space-between; align-items: baseline; width: 100%; gap: 6px; margin-top: auto; }
      .upgrade-btn .delta { font-size: 10px; color: #8b949e; font-variant-numeric: tabular-nums; }
      .upgrade-btn .cost { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .upgrade-btn .milestone { min-height:12px; font-size:9px; color:#c58aff; letter-spacing:.2px; text-shadow:0 0 7px rgba(197,138,255,.32); }
      .upgrade-copy { min-width:0; display:flex; flex-direction:column; gap:2px; }
      .upgrade-icon {
        position:relative; align-self:stretch; display:grid; place-items:center; border-radius:10px;
        color:var(--upgrade-color,#58a6ff); background:linear-gradient(180deg, color-mix(in srgb, var(--upgrade-color,#58a6ff) 18%, transparent), rgba(7,12,20,.42));
        border:1px solid color-mix(in srgb, var(--upgrade-color,#58a6ff) 42%, transparent);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 0 16px color-mix(in srgb, var(--upgrade-color,#58a6ff) 18%, transparent);
      }
      .upgrade-icon::after {
        content:''; position:absolute; inset:5px; border-radius:8px; border:1px solid color-mix(in srgb, var(--upgrade-color,#58a6ff) 24%, transparent);
      }
      .upgrade-icon .ui-icon { width:20px; height:20px; filter:drop-shadow(0 0 6px currentColor); }
      .upgrade-attack { --upgrade-color:#ff6b56; --upgrade-bg:rgba(255,107,86,.11); }
      .upgrade-defense { --upgrade-color:#62c4ff; --upgrade-bg:rgba(98,196,255,.11); }
      .upgrade-economy { --upgrade-color:#ffd45c; --upgrade-bg:rgba(255,212,92,.11); }
      .upgrade-school {
        grid-column: 1 / -1; display:flex; align-items:center; gap:8px;

      .screen { display: none; }
      .screen.active { display: block; }
      #workshop-screen, #cards-screen, #research-screen, #ultimates-screen { flex: 1; overflow-y: auto; padding: 14px; }

      #spec-selector { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:10px 0 12px; }
      #spec-selector button { padding:10px 5px; border:1px solid #30363d; border-radius:10px; color:#8b949e; background:#111722; }
      #spec-selector button.active { color:#fff; border-color:#58a6ff; background:#17263d; box-shadow:0 0 12px #58a6ff22; }

      /* Tier 選擇器 */
      #tier-selector {
        display: flex; align-items: center; gap: 10px; margin-top: 16px;
        background: var(--panel); border: 1px solid var(--brd); border-radius: 12px; padding: 10px 12px;
        box-shadow: var(--glass-hi);
      }
      #tier-selector button { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 10px;
        background: #21262d; border: 1px solid #30363d; color: #e6edf3; font-size: 16px; cursor: pointer; }
      #tier-selector button:disabled { opacity: 0.3; cursor: default; }
      #tier-info { flex: 1; text-align: center; }
      #tier-name { font-family: var(--font-num); font-size: 18px; font-weight: 800; color: #ff9d5c; letter-spacing: 1px; }
      #tier-detail { font-size: 11px; color: #8b949e; font-variant-numeric: tabular-nums; margin-top: 2px; }
      #workshop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      #workshop-screen::before, #cards-screen::before, #research-screen::before, #ultimates-screen::before {
        content:''; display:block; height:112px; margin:0 0 14px; border-radius:18px;
        border:1px solid rgba(126,160,215,.22);

          linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px) 0 0/22px 22px,
          linear-gradient(0deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0/22px 22px,
          linear-gradient(120deg, rgba(74,163,255,.14), transparent 44%),
          radial-gradient(circle at 82% 30%, rgba(255,207,74,.16), transparent 30%),
          radial-gradient(circle at 18% 78%, rgba(75,230,210,.14), transparent 34%),
          linear-gradient(160deg, rgba(20,31,49,.88), rgba(7,12,22,.92));
        box-shadow:var(--glass-hi), 0 16px 38px rgba(0,0,0,.28), inset 0 0 42px rgba(74,163,255,.06);
      }

        content:'ORBITAL CORE / DEFENSE GRID';

        color:#9ecbff; font-family:var(--font-num); font-size:10px; letter-spacing:2px;
        text-shadow:0 0 14px rgba(74,163,255,.45);

      /* 工坊 / 卡片 分頁切換 */
      .meta-nav { display: flex; gap: 8px; margin-bottom: 12px; }

        flex: 1; padding: 9px 0; background: #161b22; color: #8b949e;

      }

      /* 卡片畫面 */

      #card-loadout-label b { color: #e6edf3; }
      #card-loadout-label b.flash { color: #f85149; }
      #card-loadout { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
      .loadout-slot {
        flex: 1 1 calc(50% - 4px); min-height: 52px; display: flex; align-items: center; gap: 8px;
        padding: 8px 10px; border: 1px dashed #30363d; border-radius: 10px; background: #0d1117; cursor: pointer;
      }
      .loadout-slot.filled { border-style: solid; background: #161b22; }
      .loadout-slot .slot-icon { font-size: 20px; }

        flex: 1 1 calc(50% - 4px); min-height: 52px; padding: 6px; background: #0d1117; color: #e3b341;
        border: 1px solid #4d3b12; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; line-height: 1.4;
      }
      .slot-unlock:disabled { opacity: 0.45; cursor: default; }

      #card-inventory { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      #card-presets, #card-filters { display:flex; gap:6px; margin:8px 0; overflow-x:auto; }
      .preset-group { flex:1; min-width:118px; display:flex; border:1px solid var(--brd); border-radius:9px; overflow:hidden; }
      .preset-group button, #card-filters button { border:0; background:#161f2e; color:#9db0c8; padding:7px 9px; font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap; }
      .preset-group button:first-child { flex:1; color:#dce9f8; }
      .preset-group button + button { border-left:1px solid var(--brd); color:#58c6ff; }
      #card-filters button { border:1px solid var(--brd); border-radius:999px; }
      #card-filters button.active { color:#fff; border-color:#58a6ff; background:#203554; box-shadow:0 0 10px rgba(88,166,255,.22); }
      .card-cell {
        --rarity:#93a3b8; background:linear-gradient(180deg, color-mix(in srgb, var(--rarity) 8%, #161b22), #11161e 42%);
        border: 1px solid color-mix(in srgb, var(--rarity) 48%, #30363d); border-radius: 12px; padding: 8px;
        display: flex; flex-direction: column; gap: 6px;
      }
      .card-cell.rar-common { --rarity:#93a3b8; }
      .card-cell.rar-rare { --rarity:#4aa3ff; }
      .card-cell.rar-epic { --rarity:#c07dff; }
      .card-cell.rar-legendary { --rarity:#ffcf4a; box-shadow:0 0 18px rgba(255,207,74,.10); }
      .card-cell.equipped { border-color: var(--rarity); box-shadow: 0 0 0 1px var(--rarity), 0 0 15px color-mix(in srgb, var(--rarity) 30%, transparent); }
      .card-cell.locked { opacity: 0.72; }
      .card-art {
        position: relative; height: 132px; border-radius: 9px; overflow:hidden; display:flex; align-items:center; justify-content:center;
        border:1px solid color-mix(in srgb, var(--rarity) 65%, #ffffff18); background:#0b0e13;
      }
      .card-art-image { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .22s ease, filter .22s ease; }
      .card-cell:hover .card-art-image { transform:scale(1.035); }
      .card-art-shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.03) 35%,rgba(5,8,14,.88) 100%); }
      .card-art.locked-art .card-art-image { filter:grayscale(.85) brightness(.42); }
      .card-art.locked-art .card-icon { left:50%; top:50%; transform:translate(-50%,-50%); width:34px; height:34px; color:#d5deea !important; }
      .card-icon { position:absolute; z-index:2; left:6px; top:6px; width:21px; height:21px; display:grid; place-items:center; padding:4px; border-radius:7px; background:rgba(5,9,15,.72); backdrop-filter:blur(5px); }
      .card-stars { position:absolute; z-index:2; bottom:5px; left:0; right:0; text-align:center; font-size:12px; color:#ffd45c; text-shadow:0 1px 5px #000; letter-spacing:1px; }
      .card-rarity { position:absolute; z-index:3; top:6px; right:6px; padding:2px 6px; border-radius:999px; font-size:9px; font-weight:900; color:#09101a; background:var(--rarity); box-shadow:0 0 10px color-mix(in srgb, var(--rarity) 55%, transparent); }
      .card-name { font-size: 14px; font-weight: 800; }
      .card-sub { font-size: 11px; color: #8b949e; min-height: 26px; }
      .card-bonus { font-size: 10px; color: #6b7688; margin: -2px 0 3px; }
      .card-bonus.on { color: #7ee0b0; text-shadow: 0 0 8px rgba(126,224,176,.35); }
      .card-set { position:absolute; z-index:3; bottom:6px; right:6px; font-size:9px; font-weight:900; color:#0c1016; background:var(--card-color,#e3b341); padding:1px 5px; border-radius:999px; }
      .set-active { color: #ffd257; font-weight: 800; }
      .card-actions { display: flex; gap: 6px; }

        flex: 1; padding: 7px 4px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer;

      /* 終極武器：升級畫面 */

        display: flex; align-items: center; gap: 12px; padding: 12px;

      .ult-row.equipped { border-color:#e3b341; box-shadow:0 0 14px #e3b34122; }
      .ult-icon {
        width: 50px; height: 50px; flex: 0 0 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
        font-size: 28px; border: 1px solid #ffffff1a;
      }
      .ult-body { flex: 1; min-width: 0; }
      .ult-name { font-size: 15px; font-weight: 800; }

        display: flex; flex-direction: column; gap: 10px; z-index: 6;
      }

      #ult-tooltip.active { display:block; }
      .ult-btn {
        position: relative; width: 58px; height: 58px; border-radius: 50%;
        border: 2px solid var(--ult-color, #e3b341); background: #0d1117cc; color: #fff;
        font-size: 26px; cursor: pointer; overflow: hidden; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
        box-shadow: 0 0 12px var(--ult-color, #e3b341);
      }
      .ult-btn.ready { animation:ultReady 1s ease-in-out infinite alternate; }
      .ult-btn::before { content:""; position:absolute; inset:2px; border-radius:50%; background:conic-gradient(var(--ult-color) var(--charge,0deg),#18202c 0); opacity:.5; }
      .ult-btn .glyph { position:relative; z-index:2; }
      .ult-btn small { position:absolute; z-index:3; left:50%; top:100%; transform:translate(-50%,3px); font-size:9px; white-space:nowrap; color:#dbe7ff; }
      @keyframes ultReady { from{box-shadow:0 0 8px var(--ult-color)} to{box-shadow:0 0 25px var(--ult-color)} }
      .ult-btn:active { transform: scale(0.94); }
      .ult-btn.cooling { box-shadow: none; }
      /* 冷卻遮罩：從底部升起的暗層 + 秒數 */
      .ult-btn .cool-mask {
        position: absolute; left: 0; right: 0; bottom: 0; background: rgba(1,4,9,0.72);
        pointer-events: none;
      }
      .ult-btn .cool-num {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 16px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; pointer-events: none;
      }
      #battle-screen { flex: 1; display: none; flex-direction: column; min-height: 0; }
      #battle-screen.active { display: flex; }
      #canvas-wrap.ult-cinematic canvas { animation:ultCinematic .42s ease-out; filter:saturate(1.5) contrast(1.08); }
      @keyframes ultCinematic { 0%{transform:scale(1)} 35%{transform:scale(1.018)} 55%{transform:scale(.995)} 100%{transform:scale(1)} }

      #start-btn {
        display: block; width: 100%; margin-top: 16px; padding: 14px;

      /* Perk 三選一：戰鬥暫停時的覆蓋層 */

      /* 離線收益結算 */

        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(1, 4, 9, 0.8); z-index: 11;
      }
      #offline-modal.active { display: flex; }
      #offline-modal .card {
        background: #161b22; border: 1px solid #30363d; border-radius: 12px;

      }
      #offline-modal h2 { margin-bottom: 14px; font-size: 18px; }
      #offline-modal .row { display: flex; justify-content: space-between; gap: 24px; margin: 6px 0; font-size: 14px; }
      #offline-modal .row .label { color: #8b949e; }
      #offline-modal .row .value { font-weight: 700; font-variant-numeric: tabular-nums; }
      #offline-modal button {

        border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer;

      /* 帳戶面板（霓虹風，參考 The Tower） */
      #account-modal, #board-modal, #daily-modal {

      #daily-modal .account-card { max-width: 400px; width: 100%; }

        background: rgba(20,28,44,0.5);
      }
      .mission-row .m-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .mission-row .m-name { font-weight: 800; font-size: 14px; }
      .mission-row .m-reward { font-family: var(--font-num); font-weight: 800; color: #ffcf4a; font-size: 13px; }
      .mission-row .m-desc { font-size: 11px; color: #8b949e; margin: 2px 0 6px; }
      .mission-row .m-bar { height: 7px; border-radius: 4px; background: #0d1117; overflow: hidden; }
      .mission-row .m-bar > span { display: block; height: 100%; background: linear-gradient(90deg,#2ea043,#56d364); }
      .mission-row .m-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
      .mission-row .m-prog { font-size: 11px; color: #8b949e; font-variant-numeric: tabular-nums; }
      .mission-row .m-claim {

        display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
        border: 1px solid var(--brd); margin-bottom: 6px; background: rgba(20,28,44,0.5);
      }
      .board-row .rank { font-family: var(--font-num); font-weight: 800; color: #8b949e; width: 30px; text-align: center; }
      .board-row.top1 .rank { color: #ffd24a; } .board-row.top2 .rank { color: #cfd8e3; } .board-row.top3 .rank { color: #e0985c; }
      .board-row .who { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .board-row .score { font-family: var(--font-num); font-weight: 800; color: #ff9d5c; }
      .board-note { color: #8b949e; font-size: 13px; text-align: center; padding: 20px 8px; line-height: 1.6; }
      #account-modal .account-card {
        background: #0d1524; border: 1px solid #2b6cb0; border-radius: 14px;
        box-shadow: 0 0 22px rgba(56, 189, 248, 0.25), inset 0 0 20px rgba(56, 189, 248, 0.05);
        padding: 22px; width: 100%; max-width: 380px; animation: cardPop 0.3s ease-out;

      #account-modal h2 { text-align: center; font-size: 20px; letter-spacing: 3px; color: #cde8ff; margin-bottom: 14px; }
      .account-id {

      #account-copy {

        font-size: 13px; padding: 2px 6px; cursor: pointer; min-width: 30px; min-height: 30px;
      }
      #account-copy.copied { border-color: #2ea043; color: #56d364; }
      .account-linked-label { text-align: center; color: #8b949e; font-size: 13px; margin: 14px 0 8px; }
      .linked-row {
        display: flex; align-items: center; gap: 10px;
        background: #0a1120; border: 1px solid #2b6cb0; border-radius: 10px;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.18);
        padding: 12px 14px; margin-bottom: 8px; font-size: 15px; font-weight: 700;
      }
      .linked-row .mail { flex: 1; word-break: break-all; }
      .linked-row .check { color: #3fb950; font-size: 18px; font-weight: 900; }
      .linked-none {
        text-align: center; color: #6e7681; font-size: 13px; padding: 12px;

      .account-action {
        display: block; width: 100%; margin-top: 8px; padding: 12px;

        box-shadow: 0 0 10px rgba(56, 189, 248, 0.12);

      .account-action.danger { border-color: #6e2b2b; color: #ffb4b4; box-shadow: none; }

        display: block; width: 100%; margin-top: 16px; padding: 10px;
        background: #161b22; color: #8b949e; border: 1px solid #30363d; border-radius: 8px;
        font-size: 14px; font-weight: 700; cursor: pointer;
      }

      /* ============================================================
         視覺質感改造 · 霓虹指揮台（覆蓋層，靠 cascade 後宣告勝出）
         ============================================================ */

      /* 頂欄 / 底欄 / 認證列：玻璃質感 */
      #authbar {
        background: linear-gradient(180deg, rgba(13,19,28,0.85), rgba(9,13,20,0.7));
        border-bottom: 1px solid var(--brd); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      }
      #topbar {
        background: var(--panel); border-bottom: 1px solid var(--brd);
        box-shadow: var(--glass-hi), 0 4px 16px rgba(0,0,0,0.3);
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      }
      #topbar { gap: 9px; }
      #topbar .stat .label { color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; font-size: 9px; white-space: nowrap; }
      #topbar .stat .value { font-family: var(--font-num); font-size: 15px; letter-spacing: 0.3px; white-space: nowrap; }

      #auth-btn, #account-btn, .speed-btn {
        background: linear-gradient(160deg, rgba(40,54,78,0.8), rgba(22,30,45,0.75));
        border: 1px solid var(--brd-strong); box-shadow: var(--glass-hi);
      }

      /* 數字儀式：貨幣與屬性值用 Orbitron + 輝光 */
      .coin { color: var(--coin, #ffcf4a); text-shadow: 0 0 9px rgba(255,207,74,0.45); }
      .cash { color: var(--cash, #4fe08a); text-shadow: 0 0 9px rgba(79,224,138,0.4); }
      .upgrade-btn .value { font-family: var(--font-num); text-shadow: 0 0 10px rgba(74,163,255,0.35); }
      .upgrade-btn .cost, .research-timer, .card-stars, #account-id-val, .cool-num { font-family: var(--font-num); letter-spacing: 0.5px; }

      /* 分頁切換（工坊/卡片/研究/終極）：玻璃膠囊 + 選中發光 */
      .meta-nav button {
        background: linear-gradient(160deg, rgba(28,38,56,0.7), rgba(16,22,34,0.62));
        border: 1px solid var(--brd); box-shadow: var(--glass-hi);
        transition: color 0.2s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
      }
      .meta-nav button.active {
        border-color: var(--brd-strong); color: #dbeafe;
        box-shadow: var(--glass-hi), 0 0 14px rgba(74,163,255,0.28);
        background: linear-gradient(160deg, rgba(40,60,96,0.85), rgba(22,32,52,0.7));
      }

      /* 升級鈕 / 卡片格 / 研究列 / 終極列 / 裝備槽：統一玻璃面板 */
      .upgrade-btn, .card-cell, .research-row, .ult-row, .loadout-slot.filled {
        background: var(--panel); border: 1px solid var(--brd);
        box-shadow: var(--glass-hi), 0 3px 12px rgba(0,0,0,0.28);
      }
      .upgrade-btn:not(:disabled):active { background: linear-gradient(158deg, rgba(46,62,90,0.85), rgba(24,32,48,0.8)); }

      /* 戰鬥底欄玻璃 + 分頁動效 */
      #bottom {
        background: linear-gradient(180deg, rgba(20,27,40,0.82), rgba(12,17,26,0.9));
        border-top: 1px solid var(--brd); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      }
      #tabs button { transition: color 0.2s, border-color 0.2s, text-shadow 0.2s; letter-spacing: 0.5px; }
      #tabs button.active { text-shadow: 0 0 10px currentColor; }

      /* 買得起：綠光呼吸 + 一道流光掃過（放置遊戲核心視覺鉤子） */
      .upgrade-btn.affordable { position: relative; overflow: hidden; border-color: rgba(63,224,138,0.6); }
      .upgrade-btn.affordable::after {
        content: ''; position: absolute; top: 0; left: -60%; width: 45%; height: 100%;
        background: linear-gradient(100deg, transparent, rgba(120,255,180,0.22), transparent);
        transform: skewX(-18deg); animation: shimmer 2.6s ease-in-out infinite; pointer-events: none;
      }
      @keyframes shimmer { 0% { left: -60%; } 55%, 100% { left: 130%; } }
      @media (prefers-reduced-motion: reduce) { .upgrade-btn.affordable::after { animation: none; display: none; } }

      /* 主要行動鈕：科幻切角 + 漸層 + 流光 */
      #start-btn {
        background: linear-gradient(120deg, #1c7d47, #2ea043 42%, #48d06a);
        box-shadow: 0 0 20px rgba(46,160,67,0.5), var(--glass-hi);
        letter-spacing: 3px; position: relative; overflow: hidden; border-radius: 10px;
        clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
      }
      #start-btn::after {
        content: ''; position: absolute; top: 0; left: -50%; width: 40%; height: 100%;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,0.35), transparent);
        transform: skewX(-18deg); animation: shimmer 3.2s ease-in-out infinite; pointer-events: none;
      }

      /* 彈窗玻璃 + 景深模糊 */
      #results .card, #offline-modal .card, #account-modal .account-card, #perk-overlay .perk-box {
        background: linear-gradient(158deg, rgba(28,38,58,0.9), rgba(14,20,32,0.92));
        border: 1px solid var(--brd-strong);
        box-shadow: var(--glass-hi), 0 18px 50px rgba(0,0,0,0.5), 0 0 40px rgba(74,163,255,0.12);

      #workshop-screen h1, #cards-screen h1, #research-screen h1, #ultimates-screen h1 {
        text-shadow: 0 0 16px rgba(74,163,255,0.25);
      }

      /* ===== 統一圖示與資訊層級 ===== */
      .ui-icon { width: 1.15em; height: 1.15em; display: inline-block; flex: 0 0 auto; vertical-align: -0.18em; }
      .meta-nav button, #tabs button, #start-btn, .screen h1 { display: flex; align-items: center; justify-content: center; gap: 7px; }
      .meta-nav .ui-icon { width: 18px; height: 18px; }

      .icon-fire { color: #ff7a3d; } .icon-frost { color: #72d8ff; } .icon-risk { color: #ff6868; }

      #topbar.battle-hud { gap: 7px; padding-left: 10px; padding-right: 10px; }

      #topbar.battle-hud .stat-primary { border-color: rgba(74,163,255,.3); }
      #topbar .label { display: flex; align-items: center; gap: 4px; }
      #topbar .label .ui-icon { width: 11px; height: 11px; }

      #topbar .hp-fill { display:block; height:100%; width:100%; background:#4fe08a; box-shadow:0 0 8px currentColor; transition: width .15s, background .15s; }
      #topbar .status-pips { display:flex; gap:3px; margin-top:3px; min-height:4px; }
      #topbar .status-pips span { width:12px; height:3px; border-radius:4px; box-shadow:0 0 7px currentColor; }

      #canvas-wrap { min-height: 280px; }
      #canvas-wrap::before {
        content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
        background:
          linear-gradient(90deg, rgba(120,190,255,.035) 1px, transparent 1px) center/34px 34px,
          linear-gradient(0deg, rgba(120,190,255,.025) 1px, transparent 1px) center/34px 34px;
        mix-blend-mode:screen; opacity:.75;
      }
      #canvas-wrap::after {
        content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
        background:
          radial-gradient(circle at 50% 50%, transparent 42%, rgba(0,0,0,.24) 72%, rgba(0,0,0,.55) 100%),
          linear-gradient(180deg, rgba(140,220,255,.06), transparent 20%, transparent 80%, rgba(255,90,60,.035));
      }
      #game { z-index:0; }
      #boss-hud { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:min(82%,430px); z-index:7; display:none; padding:8px 11px; border:1px solid rgba(255,90,160,.55); border-radius:10px; background:rgba(19,7,26,.82); box-shadow:0 0 20px rgba(212,60,200,.22); backdrop-filter:blur(6px); }
      #boss-hud.active { display:block; }
      #boss-hud.threatening { animation:bossWarn .55s ease-in-out infinite alternate; }
      @keyframes bossWarn { from{border-color:rgba(255,90,160,.55)} to{border-color:#ffcf4a;box-shadow:0 0 28px rgba(255,90,80,.55)} }
      #boss-hud .boss-head { display:flex; justify-content:space-between; gap:8px; font-size:11px; font-weight:900; color:#ffc8f4; }
      #boss-hud .boss-track { height:7px; margin-top:5px; border-radius:6px; overflow:hidden; background:#240f27; }
      #boss-hud .boss-fill { height:100%; width:100%; background:linear-gradient(90deg,#d43cc8,#ff6b9d); box-shadow:0 0 10px #d43cc8; transition:width .12s; }
      #threat-warning { position:absolute; inset:0; z-index:5; pointer-events:none; border:0 solid rgba(255,50,80,0); transition:.12s; }
      #threat-warning.active { border-width:9px; border-color:rgba(255,50,80,.42); box-shadow:inset 0 0 65px rgba(255,0,40,.28); animation:threatPulse .55s infinite alternate; }
      @keyframes threatPulse { to{border-color:rgba(255,90,100,.72)} }
      #target-btn { position:absolute; right:10px; bottom:10px; z-index:7; padding:7px 10px; border-radius:9px; border:1px solid rgba(88,198,255,.5); color:#bcecff; background:rgba(8,18,30,.82); font-size:11px; font-weight:800; backdrop-filter:blur(6px); }
      #bottom { flex: 0 0 auto; }
      .upgrade-grid { height: clamp(164px, 29vh, 220px); }
      .upgrade-btn {
        border-color:color-mix(in srgb, var(--upgrade-color,#58a6ff) 34%, var(--brd));
        background:
          linear-gradient(90deg, var(--upgrade-bg,rgba(74,163,255,.08)), transparent 46%),
          var(--panel);
      }
      .upgrade-btn .name { color:#eef6ff; letter-spacing:.2px; }
      .upgrade-btn .delta { color:#9eb0c8; }
      .upgrade-btn:disabled .upgrade-icon { opacity:.65; filter:grayscale(.5); }
      .upgrade-btn .value { display:flex; align-items:baseline; gap:7px; }
      .upgrade-btn .preview { color:#4fe08a; font-size:12px; text-shadow:0 0 8px rgba(79,224,138,.35); }
      .upgrade-btn.bought { animation: upgradeBuy .42s ease-out; border-color:#7dffb0; }
      @keyframes upgradeBuy { 0%{transform:scale(.96);filter:brightness(1)} 45%{transform:scale(1.025);filter:brightness(1.8)} 100%{transform:scale(1);filter:brightness(1)} }

      .perk-card { position:relative; display:grid; grid-template-columns:40px 1fr auto; grid-template-areas:'art title rarity' 'art desc desc' 'art link link'; column-gap:10px; align-items:center; overflow:hidden; }
      .perk-card::before { content:''; position:absolute; inset:0 auto 0 0; width:3px; background:var(--perk-color,#4aa3ff); box-shadow:0 0 12px var(--perk-color,#4aa3ff); }
      .perk-art { grid-area:art; width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:var(--perk-color); background:color-mix(in srgb, var(--perk-color) 14%, transparent); border:1px solid color-mix(in srgb, var(--perk-color) 40%, transparent); }
      .perk-art .ui-icon { width:23px; height:23px; }
      .perk-name { grid-area:title; } .perk-desc { grid-area:desc; }
      .perk-rarity { grid-area:rarity; color:var(--perk-color); font-size:10px; font-weight:900; letter-spacing:1px; }
      .perk-link { grid-area:link; color:#9bb3ce; font-size:10px; }
      .perk-card.school-fire { --perk-color:#ff7a3d; } .perk-card.school-frost { --perk-color:#72d8ff; }
      .perk-card.school-risk { --perk-color:#ff6868; } .perk-card.school-stat { --perk-color:#8cb8ff; }
      .perk-card.school-trigger { --perk-color:#b98cff; }
      .perk-card.school-form { --perk-color:#4be6d2; }
      .perk-card.risky .perk-name::after { content:" 高風險"; }

      #free-banner { position:absolute; top:20%; left:50%; transform:translate(-50%,-8px); pointer-events:none; z-index:40;
        font-weight:900; font-size:15px; letter-spacing:1px; color:#0c1016; padding:7px 16px; border-radius:999px;
        background:linear-gradient(180deg,#ffe071,#f5b021); box-shadow:0 6px 22px rgba(245,176,33,.5); opacity:0; }
      #free-banner.show { animation: freePop 1s ease-out; }
      @keyframes freePop { 0%{opacity:0; transform:translate(-50%,4px) scale(.8)} 18%{opacity:1; transform:translate(-50%,-10px) scale(1.05)} 70%{opacity:1} 100%{opacity:0; transform:translate(-50%,-26px) scale(1)} }

      /* 稀有度：邊框輝光層級 + 稀有度標籤底色，傳說有金色流光 */
      .perk-card { border-color: var(--rar-line, rgba(255,255,255,.14)); }
      .perk-card .perk-rarity { background: color-mix(in srgb, var(--rar-glow,#7a8699) 22%, transparent); color: var(--rar-glow,#9bb3ce); padding:2px 7px; border-radius:999px; }
      .perk-card.rar-common { --rar-glow:#93a3b8; --rar-line:rgba(147,163,184,.35); }
      .perk-card.rar-rare { --rar-glow:#4aa3ff; --rar-line:rgba(74,163,255,.55); box-shadow:0 0 0 1px rgba(74,163,255,.25), 0 6px 22px rgba(74,163,255,.12); }
      .perk-card.rar-epic { --rar-glow:#c07dff; --rar-line:rgba(192,125,255,.6); box-shadow:0 0 0 1px rgba(192,125,255,.32), 0 6px 26px rgba(192,125,255,.18); }
      .perk-card.rar-legendary { --rar-glow:#ffcf4a; --rar-line:rgba(255,207,74,.7); box-shadow:0 0 0 1px rgba(255,207,74,.4), 0 8px 30px rgba(255,207,74,.24); }
      .perk-card.rar-legendary::after { content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(115deg, transparent 30%, rgba(255,225,140,.22) 47%, rgba(255,255,255,.35) 50%, rgba(255,225,140,.22) 53%, transparent 70%); background-size:250% 100%; animation:legendShimmer 2.6s linear infinite; }
      @keyframes legendShimmer { 0%{background-position:120% 0} 100%{background-position:-120% 0} }
      .perk-stack { position:absolute; top:8px; right:8px; font-size:9px; font-weight:900; letter-spacing:.5px; color:#0c1016; background:var(--rar-glow,#9bb3ce); padding:2px 6px; border-radius:999px; }

      #perk-actions { display:flex; gap:10px; margin-top:12px; }
      .perk-action { flex:1; padding:11px 8px; border-radius:12px; font-weight:800; font-size:13px; cursor:pointer; border:1px solid rgba(120,150,200,.35); background:linear-gradient(180deg, rgba(74,163,255,.16), rgba(74,163,255,.06)); color:#cfe2ff; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
      .perk-action .ui-icon { width:15px; height:15px; }
      .perk-action:hover:not(:disabled) { filter:brightness(1.15); }
      .perk-action:active:not(:disabled) { transform:scale(.97); }
      .perk-action:disabled { opacity:.4; cursor:not-allowed; }
      .perk-action.ghost { background:rgba(255,255,255,.04); color:#9bb3ce; }

      @media (max-width: 480px) {
        #topbar.battle-hud { display:grid; grid-template-columns:.7fr 1.25fr 1fr 1fr auto; }
        #topbar.battle-hud .hp-stat { grid-column:1 / 5; grid-row:2; flex-direction:row; align-items:center; gap:7px; }
        #topbar .hp-track { flex:1; width:auto; margin:0; }
        #topbar.battle-hud .speed-btn { grid-column:5; grid-row:1 / 3; height:100%; }
        #topbar.battle-hud .spacer { display:none; }
        #topbar .stat .value { font-size:13px; }
        #topbar .stat .value[data-zone] { max-width:86px; overflow:hidden; text-overflow:ellipsis; }
        .upgrade-grid { height:clamp(156px,28vh,202px); grid-auto-rows:auto; }
        .upgrade-btn { height:82px; min-height:82px; grid-template-columns:30px minmax(0,1fr); padding:7px; gap:7px; }
        .upgrade-icon .ui-icon { width:17px; height:17px; }
        #wave-banner { max-width:92%; white-space:normal; text-align:center; font-size:13px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="authbar"><span id="auth-status">本機存檔</span><button id="sync-btn" type="button" hidden>重試同步</button><button id="sound-btn" type="button" title="音效開關">🔊</button><button id="board-btn" type="button" title="排行榜">🏆</button><button id="daily-btn" type="button" title="每日任務">📋</button><button id="account-btn" type="button">帳戶</button><button id="auth-btn" type="button">Google 登入</button></div>
      <header id="topbar"></header>

      <div id="workshop-screen" class="screen active">
        <div class="meta-nav">
          <button data-meta="workshop" class="active" type="button">工坊</button>
          <button data-meta="cards" type="button">卡片</button>
          <button data-meta="research" type="button">研究</button>
          <button data-meta="ultimates" type="button">終極</button>
        </div>
        <h1>工坊</h1>
        <div class="sub">用金幣購買永久升級，每一場都會更強</div>
        <div id="spec-selector">
          <button data-spec="firepower">🔥 火力核心<br><small>傷害、必爆</small></button>
          <button data-spec="fortress">🛡️ 堡壘核心<br><small>生命、減傷</small></button>
          <button data-spec="economy">🪙 經濟核心<br><small>現金、金幣</small></button>
        </div>
        <div id="workshop-grid"></div>
        <div id="tier-selector">
          <button id="tier-prev" type="button" aria-label="上一個 Tier">◀</button>
          <div id="tier-info">
            <div id="tier-name">Tier 1</div>
            <div id="tier-detail"></div>
          </div>
          <button id="tier-next" type="button" aria-label="下一個 Tier">▶</button>
        </div>
        <button id="start-btn">開始戰鬥</button>
      </div>

      <div id="cards-screen" class="screen">
        <div class="meta-nav">
          <button data-meta="workshop" type="button">工坊</button>
          <button data-meta="cards" class="active" type="button">卡片</button>
          <button data-meta="research" type="button">研究</button>
          <button data-meta="ultimates" type="button">終極</button>
        </div>
        <h1>卡片</h1>
        <div class="sub">戰前配置卡片，槽位有限——取捨出你的流派</div>
        <div id="recommended-builds"></div>
        <div id="card-presets"></div>
        <div id="card-loadout-label"></div>
        <div id="card-loadout"></div>
        <div id="card-filters"></div>
        <div id="card-inventory"></div>
      </div>

      <div id="research-screen" class="screen">
        <div class="meta-nav">
          <button data-meta="workshop" type="button">工坊</button>
          <button data-meta="cards" type="button">卡片</button>
          <button data-meta="research" class="active" type="button">研究</button>
          <button data-meta="ultimates" type="button">終極</button>
        </div>
        <h1>研究室</h1>
        <div class="sub">用真實時間跑研究，離線也在推進——一次只能跑一項</div>
        <div id="research-list"></div>
      </div>

      <div id="ultimates-screen" class="screen">
        <div class="meta-nav">
          <button data-meta="workshop" type="button">工坊</button>
          <button data-meta="cards" type="button">卡片</button>
          <button data-meta="research" type="button">研究</button>
          <button data-meta="ultimates" class="active" type="button">終極</button>
        </div>
        <h1>終極武器</h1>
        <div class="sub">戰鬥中施放的大招——達里程碑解鎖，用金幣升級威力與冷卻</div>
        <div id="ultimates-list"></div>
      </div>

      <div id="battle-screen" class="screen">
        <div id="canvas-wrap">
          <canvas id="game"></canvas>
          <div id="boss-hud"><div class="boss-head"><span data-boss-name>頭目</span><span data-boss-skill>召喚蓄力</span></div><div class="boss-track"><div class="boss-fill"></div></div></div>
          <div id="threat-warning"></div>
          <div id="wave-banner"></div>
          <div id="free-banner">🪙 免費升級！</div>
          <div id="ult-bar"></div>
          <div id="ult-tooltip"></div>
          <button id="target-btn" type="button">索敵：最近</button>
        </div>
        <div id="bottom">
          <div id="tabs"></div>
          <div id="battle-grid" class="upgrade-grid"></div>
        </div>
      </div>

      <div id="results">
        <div class="card">
          <h2>⚔️ 戰鬥結束</h2>
          <div id="results-rows"></div>
          <button id="results-btn">回到工坊</button>
        </div>
      </div>

      <div id="perk-overlay">
        <div class="perk-box">
          <h2>⭐ 選擇一項強化</h2>
          <div class="sub" id="perk-sub"></div>
          <div id="perk-cards"></div>
          <div id="perk-actions">
            <button id="perk-reroll" class="perk-action">重骰</button>
            <button id="perk-skip" class="perk-action ghost">跳過領錢</button>
          </div>
        </div>
      </div>

      <div id="route-overlay">
        <div class="route-box">
          <h2>🧭 選擇下一段航道</h2>
          <div class="sub" id="route-sub">接下來 10 波將套用此路線</div>
          <div class="route-options">
            <button class="route-option" data-route="safe"><strong>🛡️ 穩定航道</strong><span>敵人 -10% HP／傷害<br>獎勵 -10%</span></button>
            <button class="route-option danger" data-route="danger"><strong>🔥 危險裂隙</strong><span>敵人 +25% HP、+15% 傷害<br>獎勵 +50%</span></button>
            <button class="route-option" data-route="anomaly" hidden><strong>🌀 異常星雲</strong><span>更多菁英詞綴<br>敵人 +10% HP、獎勵 +25%</span></button>
          </div>
        </div>
      </div>

      <div id="offline-modal">
        <div class="card">
          <h2>🌙 離線收益</h2>
          <div id="offline-rows"></div>
          <button id="offline-btn">收下</button>
        </div>
      </div>

      <div id="account-modal">
        <div class="account-card">
          <h2>帳戶</h2>
          <div class="account-id">ID: <span id="account-id-val">—</span><button id="account-copy" type="button" title="複製 ID">📋</button></div>
          <div class="account-linked-label">已連結帳號</div>
          <div id="account-linked"></div>
          <div id="account-actions"></div>
          <button id="account-close" type="button">關閉</button>
        </div>
      </div>

      <div id="board-modal">
        <div class="account-card">
          <h2>🏆 全球排行榜</h2>
          <div class="account-linked-label" id="board-sub">最高波次</div>
          <div id="board-list"></div>
          <button id="board-close" type="button">關閉</button>
        </div>
      </div>

      <div id="daily-modal">
        <div class="account-card">
          <h2>📋 每日任務</h2>
          <div class="account-linked-label">每天重置 · 完成領金幣</div>
          <div id="daily-list"></div>
          <button id="daily-close" type="button">關閉</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
