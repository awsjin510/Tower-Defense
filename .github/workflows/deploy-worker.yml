name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf:types
      - run: npm test
      - run: >-
          npx wrangler deploy
          --var FIREBASE_PROJECT_ID:${{ vars.FIREBASE_PROJECT_ID }}
          --var ENVIRONMENT:production
          --var ALLOWED_ORIGINS:https://awsjin510.github.io
      - run: npm run cf:migrate:remote
